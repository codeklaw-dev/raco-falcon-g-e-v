# Fly.io config. Rename `app` before the first deploy if the name is taken
# (Fly app names are global), and update GEV_ALLOWED_HOSTS to match.
app = "raco-falcon-g-e-v"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # The server rejects any Host header not on this list (build/allowedHosts.js).
  # Add custom domains here, comma-separated.
  GEV_ALLOWED_HOSTS = "raco-falcon-g-e-v.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  processes = ["app"]
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
